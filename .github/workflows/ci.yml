name: Release checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_GOOGLE_MAP_TILES_API_KEY: ""
      PUBLIC_CESIUM_ION_TOKEN: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run photos:check:generated
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          PLAYWRIGHT_USE_PREVIEW: "1"
